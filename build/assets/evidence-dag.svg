<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Illustrative evidence dependency graph: five clues feed two deductions which feed a conclusion, numbered in one valid topological order">
<style>text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}.b{animation:bl 1.1s steps(1) infinite}@keyframes bl{0%,60%{opacity:1}61%,100%{opacity:0}}.fl{animation:fl 5s steps(1) infinite}@keyframes fl{0%,40%{opacity:1}41%{opacity:.25}42%{opacity:1}70%{opacity:1}71%{opacity:.2}73%{opacity:1}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}.rn{animation:rn .8s linear infinite}@keyframes rn{from{transform:translate(0,-60px)}to{transform:translate(-14px,0)}}@media (prefers-reduced-motion:reduce){.b,.fl,.pu,.rn{animation:none}}</style>
<rect x=".5" y=".5" width="1199" height="439" rx="8" fill="#101614" stroke="#25332d"/><text x="30" y="36" font-size="11" fill="#8fb89a" letter-spacing="4">EVIDENCE DAG // DEPENDENCIES AND UNLOCK ORDER</text><path d="M340 98.0C450.0 98.0 450.0 148 552 148" fill="none" stroke="#46544d" stroke-width="2"/><path d="M548 142l12 6l-12 6z" fill="#e0a458"/><path d="M340 168.0C450.0 168.0 450.0 148 552 148" fill="none" stroke="#46544d" stroke-width="2"/><path d="M548 142l12 6l-12 6z" fill="#e0a458"/><path d="M340 308.0C450.0 308.0 450.0 148 552 148" fill="none" stroke="#46544d" stroke-width="2"/><path d="M548 142l12 6l-12 6z" fill="#e0a458"/><path d="M340 238.0C450.0 238.0 450.0 298 552 298" fill="none" stroke="#46544d" stroke-width="2"/><path d="M548 292l12 6l-12 6z" fill="#e0a458"/><path d="M340 378.0C450.0 378.0 450.0 298 552 298" fill="none" stroke="#46544d" stroke-width="2"/><path d="M548 292l12 6l-12 6z" fill="#e0a458"/><path d="M800 148C840.0 148 840.0 225 872 225" fill="none" stroke="#46544d" stroke-width="2"/><path d="M868 219l12 6l-12 6z" fill="#e0a458"/><path d="M800 298C840.0 298 840.0 225 872 225" fill="none" stroke="#46544d" stroke-width="2"/><path d="M868 219l12 6l-12 6z" fill="#e0a458"/><rect x="40" y="70" width="300" height="56" rx="5" fill="#0c120f" stroke="#2f4a3a"/><text x="58" y="94" font-size="11" fill="#8fb89a" letter-spacing="2" font-weight="bold">CLUE</text><text x="108" y="94" font-size="11" fill="#68766f" letter-spacing="1">WITNESS STATEMENT</text><text x="58" y="114" font-size="13" fill="#e6dfcb">heard something at night</text><circle cx="340" cy="98.0" r="13" fill="#101614" stroke="#e0a458"/><text x="340" y="103.0" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">1</text><rect x="40" y="140" width="300" height="56" rx="5" fill="#0c120f" stroke="#2f4a3a"/><text x="58" y="164" font-size="11" fill="#8fb89a" letter-spacing="2" font-weight="bold">CLUE</text><text x="108" y="164" font-size="11" fill="#68766f" letter-spacing="1">WITNESS STATEMENT</text><text x="58" y="184" font-size="13" fill="#e6dfcb">saw a visitor</text><circle cx="340" cy="168.0" r="13" fill="#101614" stroke="#e0a458"/><text x="340" y="173.0" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">2</text><rect x="40" y="210" width="300" height="56" rx="5" fill="#0c120f" stroke="#2f4a3a"/><text x="58" y="234" font-size="11" fill="#8fb89a" letter-spacing="2" font-weight="bold">CLUE</text><text x="108" y="234" font-size="11" fill="#68766f" letter-spacing="1">PHYSICAL TRACE</text><text x="58" y="254" font-size="13" fill="#e6dfcb">left at the scene</text><circle cx="340" cy="238.0" r="13" fill="#101614" stroke="#e0a458"/><text x="340" y="243.0" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">3</text><rect x="40" y="280" width="300" height="56" rx="5" fill="#0c120f" stroke="#2f4a3a"/><text x="58" y="304" font-size="11" fill="#8fb89a" letter-spacing="2" font-weight="bold">CLUE</text><text x="108" y="304" font-size="11" fill="#68766f" letter-spacing="1">SIGHTING</text><text x="58" y="324" font-size="13" fill="#e6dfcb">timed and placed</text><circle cx="340" cy="308.0" r="13" fill="#101614" stroke="#e0a458"/><text x="340" y="313.0" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">4</text><rect x="40" y="350" width="300" height="56" rx="5" fill="#0c120f" stroke="#2f4a3a"/><text x="58" y="374" font-size="11" fill="#8fb89a" letter-spacing="2" font-weight="bold">CLUE</text><text x="108" y="374" font-size="11" fill="#68766f" letter-spacing="1">PHYSICAL TRACE</text><text x="58" y="394" font-size="13" fill="#e6dfcb">found elsewhere</text><circle cx="340" cy="378.0" r="13" fill="#101614" stroke="#e0a458"/><text x="340" y="383.0" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">5</text><rect x="560" y="120" width="240" height="56" rx="5" fill="#16140c" stroke="#8a5f2a"/><text x="578" y="144" font-size="11" fill="#e0a458" letter-spacing="2" font-weight="bold">DEDUCTION</text><text x="578" y="164" font-size="13" fill="#e6dfcb">someone was there</text><circle cx="800" cy="148" r="13" fill="#101614" stroke="#e0a458"/><text x="800" y="153" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">6</text><rect x="560" y="270" width="240" height="56" rx="5" fill="#16140c" stroke="#8a5f2a"/><text x="578" y="294" font-size="11" fill="#e0a458" letter-spacing="2" font-weight="bold">DEDUCTION</text><text x="578" y="314" font-size="13" fill="#e6dfcb">they left traces</text><circle cx="800" cy="298" r="13" fill="#101614" stroke="#e0a458"/><text x="800" y="303" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">7</text><rect x="880" y="195" width="280" height="60" rx="5" fill="#241410" stroke="#c4552d" stroke-width="2"/><text x="898" y="221" font-size="11" fill="#c4552d" letter-spacing="2" font-weight="bold">CONCLUSION</text><text x="898" y="241" font-size="12.5" fill="#e6dfcb">close the case  //  needs 4+ clues</text><circle cx="1160" cy="225" r="13" fill="#101614" stroke="#e0a458"/><text x="1160" y="230" font-size="13" font-weight="bold" fill="#e0a458" text-anchor="middle">8</text><text x="1160" y="400" font-size="11" fill="#68766f" text-anchor="end" letter-spacing="2">NUMBERS = ONE VALID TOPOLOGICAL UNLOCK ORDER</text><text x="1160" y="420" font-size="11" fill="#68766f" text-anchor="end" letter-spacing="2">ILLUSTRATION OF THE IDEA, NOT THE GAME'S REAL CLUE GRAPH</text><text x="30" y="420" font-size="11" fill="#68766f" letter-spacing="2">EACH CLUE LIVES IN A HASH MAP, KEYED BY ID</text></svg>