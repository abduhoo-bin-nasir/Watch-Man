<svg xmlns="http://www.w3.org/2000/svg" width="590" height="190" viewBox="0 0 590 190" role="img" aria-label="Strict separation: the game state owns all evidence and the LLM only drives personality and voice, preventing hallucinated clues.">
<style>
  text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .bar{animation:bar 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .scan{animation:scan 2.6s linear infinite} @keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(58px)}}
  .hl{animation:hl 3.6s steps(1) infinite} @keyframes hl{0%{opacity:1}33%{opacity:.25}66%{opacity:.25}100%{opacity:1}}
  .hl2{animation:hl2 3.6s steps(1) infinite} @keyframes hl2{0%,33%{opacity:.25}34%,66%{opacity:1}67%,100%{opacity:.25}}
  .hl3{animation:hl3 3.6s steps(1) infinite} @keyframes hl3{0%,66%{opacity:.25}67%,100%{opacity:1}}
</style>
<rect x=".5" y=".5" width="589" height="189" rx="10" fill="#101614" stroke="#25332d"/>
<rect x=".5" y=".5" width="5" height="189" rx="2" fill="#e0a458"/>
<g transform="translate(28,36)"><rect width="84" height="84" rx="6" fill="#0b100e" stroke="#25332d"/><rect x="8" y="26" width="26" height="32" rx="3" fill="none" stroke="#e0453d" stroke-width="1.8"/><rect x="50" y="26" width="26" height="32" rx="3" fill="none" stroke="#e0a458" stroke-width="1.8"/><line x1="42" y1="12" x2="42" y2="72" stroke="#8fb89a" stroke-dasharray="4 4" class="off"/><text x="21" y="45" font-size="7.5" fill="#e0453d" text-anchor="middle">TRUTH</text><text x="63" y="45" font-size="7.5" fill="#e0a458" text-anchor="middle">VOICE</text><style>.off{animation:offd 1.6s linear infinite}@keyframes offd{to{stroke-dashoffset:-16}}</style></g>
<text x="136" y="50" font-size="22" font-weight="bold" fill="#e0a458" letter-spacing="1">STRICT STATE SEPARATION</text>
<text x="136" y="92" font-size="16" fill="#e6dfcb" fill-opacity=".88">Game state owns every ground-truth</text><text x="136" y="117" font-size="16" fill="#e6dfcb" fill-opacity=".88">piece of evidence. The LLM only drives</text><text x="136" y="142" font-size="16" fill="#e6dfcb" fill-opacity=".88">personality and voice, so it cannot</text><text x="136" y="167" font-size="16" fill="#e6dfcb" fill-opacity=".88">hallucinate clues.</text>
</svg>