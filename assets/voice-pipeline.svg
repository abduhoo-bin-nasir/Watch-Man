h="6">TEXT-INPUT FALLBACK</text><path d="M774.0 190V220H948.0V190" fill="none" stroke="#e0a458" stroke-width="1.6"/><path d="M943.0 198l5 -8l5 8z" fill="#e0a458"/><text x="861.0" y="214" font-size="10" fill="#e0a458" text-anchor="middle" letter-spacing="2" style="paint-order:stroke" stroke="#101614" stroke-width="6">FACTS IN, VOICE OUT</text><text x="30" y="260" font-size="14" fill="#e6dfcb">Game state owns the ground truth.</text><text x="30" y="282" font-size="13" fill="#b9c2bb">The LLM only supplies personality and voice, so it cannot invent clues.</text></svg>