<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Planned offline voice pipeline: microphone, whisper.cpp, intent matching, watch state, game state that owns the facts, llama.cpp for voice only, Piper text to speech, with a text-input fallback">
