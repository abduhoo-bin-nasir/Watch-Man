<svg xmlns="http://www.w3.org/2000/svg" width="590" height="190" viewBox="0 0 590 190" role="img" aria-label="Rogue AI negotiation state machine with hidden drives, Ego, Paranoia and Trust, driven by classified voice intents.">
<style>
  text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .bar{animation:bar 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .scan{animation:scan 2.6s linear infinite} @keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(58px)}}
  .hl{animation:hl 3.6s steps(1) infinite} @keyframes hl{0%{opacity:1}33%{opacity:.25}66%{opacity:.25}100%{opacity:1}}
  .hl2{animation:hl2 3.6s steps(1) infinite} @keyframes hl2{0%,33%{opacity:.25}34%,66%{opacity:1}67%,100%{opacity:.25}}
  .hl3{animation:hl3 3.6s steps(1) infinite} @keyframes hl3{0%,66%{opacity:.25}67%,100%{opacity:1}}
</style>
<rect x=".5" y=".5" width="589" height="189" rx="10" fill="#101614" stroke="#25332d"/>
<rect x=".5" y=".5" width="5" height="189" rx="2" fill="#e0453d"/>
<g transform="translate(28,36)"><rect width="84" height="84" rx="6" fill="#0b100e" stroke="#25332d"/><g stroke="#68766f" fill="none"><path d="M26 28L58 28M26 28L42 62M58 28L42 62"/></g><circle class="hl" cx="26" cy="28" r="9" fill="#e0453d"/><circle class="hl2" cx="58" cy="28" r="9" fill="#e0a458"/><circle class="hl3" cx="42" cy="62" r="9" fill="#8fb89a"/></g>
<text x="136" y="50" font-size="22" font-weight="bold" fill="#e0453d" letter-spacing="1">ROGUE AI NEGOTIATION</text>
<text x="136" y="92" font-size="16" fill="#e6dfcb" fill-opacity=".88">Hidden drives: Ego, Paranoia, Trust.</text><text x="136" y="117" font-size="16" fill="#e6dfcb" fill-opacity=".88">Your voice is classified into emotional</text><text x="136" y="142" font-size="16" fill="#e6dfcb" fill-opacity=".88">intents that unlock restricted clues.</text><text x="136" y="167" font-size="16" fill="#e6dfcb" fill-opacity=".88">Flatter it. Pressure it. Pay for it.</text>
</svg>