<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="The watch is still listening">
<style>
  text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .iris{animation:look 5s ease-in-out infinite} @keyframes look{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
</style>
<defs><clipPath id="ec"><ellipse rx="34" ry="18"/></clipPath></defs>
<rect width="1200" height="110" rx="10" fill="#090c0b" stroke="#25332d"/>
<line x1="30" y1="22" x2="1170" y2="22" stroke="#c4552d" stroke-dasharray="2 6"/>
<g transform="translate(600,66)">
  <g clip-path="url(#ec)"><ellipse rx="34" ry="18" fill="#120a09"/><g class="iris"><circle r="13" fill="#e0453d"/><circle r="5" fill="#1a0504"/><circle cx="-3" cy="-3" r="2" fill="#fff"/></g></g>
  <ellipse rx="34" ry="18" fill="none" stroke="#e0453d" stroke-width="2"/>
</g>
<text x="540" y="72" font-size="14" fill="#8fb89a" letter-spacing="4" text-anchor="end">THE WATCH</text>
<text x="660" y="72" font-size="14" fill="#8fb89a" letter-spacing="4">IS STILL LISTENING<tspan class="blink" fill="#e0453d"> &#9608;</tspan></text>
</svg>