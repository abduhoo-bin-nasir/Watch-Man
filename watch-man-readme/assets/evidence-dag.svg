<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" role="img" aria-label="Illustration of an evidence dependency graph: clues feed deductions, which feed a conclusion. A topological sort gives the order in which evidence can be unlocked.">
<style>
  text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

@keyframes lit1{0%,0%{stroke:#25332d;filter:none}2%,13%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}16%,100%{stroke:#25332d;filter:none}}
@keyframes lit2{0%,14%{stroke:#25332d;filter:none}16%,27%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}30%,100%{stroke:#25332d;filter:none}}
@keyframes lit3{0%,28%{stroke:#25332d;filter:none}30%,41%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}44%,100%{stroke:#25332d;filter:none}}
@keyframes lit4{0%,42%{stroke:#25332d;filter:none}44%,55%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}58%,100%{stroke:#25332d;filter:none}}
@keyframes lit5{0%,56%{stroke:#25332d;filter:none}58%,69%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}72%,100%{stroke:#25332d;filter:none}}
@keyframes lit6{0%,70%{stroke:#25332d;filter:none}72%,83%{stroke:#e0a458;filter:drop-shadow(0 0 7px #e0a458)}86%,100%{stroke:#25332d;filter:none}}

  .str{stroke:#e0453d;stroke-width:2;stroke-dasharray:6 5;animation:sf 1.2s linear infinite;opacity:.85} @keyframes sf{to{stroke-dashoffset:-22}}
</style>
<rect x=".5" y=".5" width="589" height="329" rx="10" fill="#101614" stroke="#25332d"/>
<text x="20" y="28" font-size="15" fill="#e0a458" letter-spacing="3">EVIDENCE DAG</text>
<text x="570" y="28" font-size="11" fill="#68766f" text-anchor="end" letter-spacing="2">ILLUSTRATION</text>
<line class="str" x1="70" y1="70" x2="250" y2="120"/><path d="M199.0 105.8L188.8 97.8L186.1 107.4Z" fill="#e0453d"/><line class="str" x1="70" y1="200" x2="250" y2="120"/><path d="M199.0 142.7L186.0 143.0L190.1 152.1Z" fill="#e0453d"/><line class="str" x1="250" y1="120" x2="415" y2="196"/><path d="M364.0 172.5L355.2 162.9L351.0 172.0Z" fill="#e0453d"/><line class="str" x1="250" y1="262" x2="415" y2="196"/><path d="M364.0 216.4L351.0 216.2L354.7 225.5Z" fill="#e0453d"/><line class="str" x1="415" y1="196" x2="500" y2="92"/><path d="M474.7 123.0L463.2 129.1L470.9 135.5Z" fill="#e0453d"/><g><rect style="animation:lit1 12s infinite" x="22.0" y="42.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="70" cy="41.0" r="4" fill="#e0453d"/><text x="70" y="66" font-size="14" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">CLUE</text><text x="70" y="86" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">1</text></g><g><rect style="animation:lit2 12s infinite" x="22.0" y="172.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="70" cy="171.0" r="4" fill="#e0453d"/><text x="70" y="196" font-size="14" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">CLUE</text><text x="70" y="216" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">2</text></g><g><rect style="animation:lit3 12s infinite" x="202.0" y="234.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="250" cy="233.0" r="4" fill="#e0453d"/><text x="250" y="258" font-size="14" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">CLUE</text><text x="250" y="278" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">3</text></g><g><rect style="animation:lit4 12s infinite" x="202.0" y="92.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="250" cy="91.0" r="4" fill="#e0453d"/><text x="250" y="116" font-size="12" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">DEDUCTION</text><text x="250" y="136" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">4</text></g><g><rect style="animation:lit5 12s infinite" x="367.0" y="168.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="415" cy="167.0" r="4" fill="#e0453d"/><text x="415" y="192" font-size="12" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">DEDUCTION</text><text x="415" y="212" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">5</text></g><g><rect style="animation:lit6 12s infinite" x="452.0" y="64.0" width="96" height="56" rx="4" fill="#151d1a" stroke="#25332d" stroke-width="2"/><circle cx="500" cy="63.0" r="4" fill="#e0453d"/><text x="500" y="88" font-size="12" fill="#e6dfcb" text-anchor="middle" letter-spacing="1">CONCLUSION</text><text x="500" y="108" font-size="15" fill="#e0a458" text-anchor="middle" font-weight="bold">6</text></g>
<text x="295" y="312" font-size="14" fill="#68766f" text-anchor="middle">numbers = topological unlock order</text>
</svg>