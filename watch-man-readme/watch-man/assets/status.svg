<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Case status: what is built and what is planned">
<style>text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}.b{animation:bl 1.1s steps(1) infinite}@keyframes bl{0%,60%{opacity:1}61%,100%{opacity:0}}.fl{animation:fl 5s steps(1) infinite}@keyframes fl{0%,40%{opacity:1}41%{opacity:.25}42%{opacity:1}70%{opacity:1}71%{opacity:.2}73%{opacity:1}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}.rn{animation:rn .8s linear infinite}@keyframes rn{from{transform:translate(0,-60px)}to{transform:translate(-14px,0)}}@media (prefers-reduced-motion:reduce){.b,.fl,.pu,.rn{animation:none}}</style>
<rect x="0.5" y="0.5" width="579" height="419" rx="6" fill="#101614" stroke="#25332d"/><path d="M1 6a5 5 0 0 1 5-5h2v418h-2a5 5 0 0 1-5-5z" fill="#e0a458"/><text x="34" y="38" font-size="13" font-weight="bold" fill="#e0a458" letter-spacing="5">BUILT</text><rect x="110" y="27" width="10" height="10" fill="#e0a458"/><rect x="34" y="66" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 77l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="82" font-size="14.5" fill="#e6dfcb">Pixel column renderer with per-cell floor and</text><text x="72" y="100" font-size="14.5" fill="#e6dfcb">ceiling heights</text><rect x="34" y="118" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 129l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="134" font-size="14.5" fill="#e6dfcb">Real stairs between two floors</text><rect x="34" y="170" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 181l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="186" font-size="14.5" fill="#e6dfcb">Procedural textures, numbered doors and pixel-</text><text x="72" y="204" font-size="14.5" fill="#e6dfcb">art sprites</text><rect x="34" y="222" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 233l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="238" font-size="14.5" fill="#e6dfcb">Per-pixel lighting from ceiling bulbs, vignette</text><text x="72" y="256" font-size="14.5" fill="#e6dfcb">and grain</text><rect x="34" y="274" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 285l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="290" font-size="14.5" fill="#e6dfcb">NPCs on waypoint loops, door knocks and NPC</text><text x="72" y="308" font-size="14.5" fill="#e6dfcb">lines</text><rect x="34" y="326" width="22" height="22" rx="3" fill="#e0a458"/><path d="M39 337l5 5l8 -11" fill="none" stroke="#1a1206" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="342" font-size="14.5" fill="#e6dfcb">Keyboard movement and mouse look</text><rect x="620.5" y="0.5" width="579" height="419" rx="6" fill="#101614" stroke="#25332d"/><path d="M621 6a5 5 0 0 1 5-5h2v418h-2a5 5 0 0 1-5-5z" fill="#68766f"/><text x="654" y="38" font-size="13" font-weight="bold" fill="#b9c2bb" letter-spacing="5">PLANNED, IN ORDER</text><rect x="654" y="66" width="22" height="22" rx="3" fill="none" stroke="#68766f" stroke-dasharray="3 2"/><text x="665" y="82" font-size="13" font-weight="bold" fill="#b9c2bb" text-anchor="middle">1</text><text x="692" y="82" font-size="14.5" fill="#e6dfcb">Clue system and case board (hash map + DAG)</text><rect x="654" y="128" width="22" height="22" rx="3" fill="none" stroke="#68766f" stroke-dasharray="3 2"/><text x="665" y="144" font-size="13" font-weight="bold" fill="#b9c2bb" text-anchor="middle">2</text><text x="692" y="144" font-size="14.5" fill="#b9c2bb">Trust meter and intent classifier, with a</text><text x="692" y="162" font-size="14.5" fill="#b9c2bb">stubbed AI first</text><rect x="654" y="190" width="22" height="22" rx="3" fill="none" stroke="#68766f" stroke-dasharray="3 2"/><text x="665" y="206" font-size="13" font-weight="bold" fill="#b9c2bb" text-anchor="middle">3</text><text x="692" y="206" font-size="14.5" fill="#b9c2bb">Offline voice loop: whisper.cpp, llama.cpp,</text><text x="692" y="224" font-size="14.5" fill="#b9c2bb">Piper</text><rect x="654" y="252" width="22" height="22" rx="3" fill="none" stroke="#68766f" stroke-dasharray="3 2"/><text x="665" y="268" font-size="13" font-weight="bold" fill="#b9c2bb" text-anchor="middle">4</text><text x="692" y="268" font-size="14.5" fill="#b9c2bb">NPC pathfinding (BFS / A*) and an event</text><text x="692" y="286" font-size="14.5" fill="#b9c2bb">scheduler (min-heap)</text><rect x="654" y="314" width="22" height="22" rx="3" fill="none" stroke="#68766f" stroke-dasharray="3 2"/><text x="665" y="330" font-size="13" font-weight="bold" fill="#b9c2bb" text-anchor="middle">5</text><text x="692" y="330" font-size="14.5" fill="#b9c2bb">Split into modules for the project presentation</text><text x="654" y="402" font-size="10.5" fill="#68766f" letter-spacing="2">STATUS FROM THE LATEST PROJECT NOTES</text></svg>