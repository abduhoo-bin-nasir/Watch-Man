" y="116" font-size="12" fill="#b9c2bb" letter-spacing="3">PARANOIA</text><rect x="550" y="104" width="330" height="14" fill="#141c18"/><rect x="550" y="104" width="181.50000000000003" height="14" fill="#e0a458"/><text x="426" y="142" font-size="12" fill="#b9c2bb" letter-spacing="3">BOREDOM</text><rect x="550" y="130" width="330" height="14" fill="#141c18"/><rect x="550" y="130" width="125.4" height="14" fill="#46544d"/><text x="426" y="168" font-size="12" fill="#8fb89a" letter-spacing="3" font-weight="bold">TRUST</text><rect x="550" y="156" width="330" height="14" fill="#141c18"/><rect x="550" y="156" width="46.2" height="14" fill="#4f6e5c"/><rect x="596.2" y="156" width="85.8" height="14" fill="#8fb89a"/><line x1="632.5" y1="152" x2="632.5" y2="174" stroke="#e6dfcb" stroke-dasharray="2 2"/><line x1="715.0" y1="152" x2="715.0" y2="174" stroke="#e6dfcb" stroke-dasharray="2 2"/><line x1="797.5" y1="152" x2="797.5" y2="174" stroke="#e6dfcb" stroke-dasharray="2 2"/><text x="894" y="168" font-size="10" fill="#68766f" letter-spacing="2">CLUE GATES</text><text x="1030" y="82" font-size="11" fill="#8fb89a" letter-spacing="3">INTENTS</text><rect x="1030" y="92" width="110" height="16" rx="3" fill="#2a2114" stroke="#e0a458"/><text x="1085" y="104" font-size="9.5" fill="#e0a458" text-anchor="middle" letter-spacing="2">FLATTERY</text><rect x="1030" y="112" width="110" height="16" rx="3" fill="#101714" stroke="#25332d"/><text x="1085" y="124" font-size="9.5" fill="#68766f" text-anchor="middle" letter-spacing="2">APOLOGY</text><rect x="1030" y="132" width="110" height="16" rx="3" fill="#101714" stroke="#25332d"/><text x="1085" y="144" font-size="9.5" fill="#68766f" text-anchor="middle" letter-spacing="2">THREAT</text><rect x="1030" y="152" width="110" height="16" rx="3" fill="#101714" stroke="#25332d"/><text x="1085" y="164" font-size="9.5" fill="#68766f" text-anchor="middle" letter-spacing="2">BRIBE</text><rect x="1030" y="172" width="110" height="16" rx="3" fill="#101714" stro